<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>德州扑克 · 在线房间</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>

<header id="topbar">
  <h1>♠ 德州扑克 · 在线房间</h1>
  <div class="hand-no">房间 <b id="room-code">—</b> · 第 <span id="hand-no">0</span> 局 · <span id="blinds-text">盲注 10 / 20</span></div>
  <button id="btn-straddle">抓位</button>
  <button id="btn-buyins">买入记录</button>
  <button id="btn-leave">离开房间</button>
</header>

<div id="main">
  <div id="table-wrap">
    <div id="table">
      <div id="pot-area"></div>
      <div id="community"></div>
      <div id="seats"></div>
      <div id="wait-panel">
        <div class="room-code-tip">房间码（发给好友加入）</div>
        <div id="wait-code"></div>
        <div id="wait-count"></div>
        <button id="btn-start2">开始游戏</button>
        <div id="wait-tip">等待房主开始…</div>
      </div>
    </div>
  </div>
  <aside id="log-panel">
    <h3>游戏日志</h3>
    <div id="log"></div>
  </aside>
</div>

<footer id="controls">
  <div id="hint-row">
    <div id="hint"></div>
    <div id="timer-box">
      <div id="timer-num">60</div>
      <div id="timer-track"><div id="timer-bar"></div></div>
    </div>
  </div>
  <button id="btn-fold" disabled>弃牌</button>
  <button id="btn-call" disabled>过牌</button>
  <div id="raise-box">
    <div id="quick-bets">
      <button data-frac="0.5" disabled>1/2</button>
      <button data-frac="0.333" disabled>1/3</button>
      <button data-frac="0.25" disabled>1/4</button>
      <button data-frac="1" disabled>1x</button>
      <button data-frac="1.5" disabled>1.5x</button>
      <button data-frac="2" disabled>2x</button>
      <button data-frac="all" disabled>Allin</button>
    </div>
    <div class="row2">
      <span id="raise-amt"></span>
      <input type="range" id="raise-slider" disabled>
      <button id="btn-raise" disabled>加注</button>
    </div>
  </div>
  <button id="btn-allin" disabled>全下</button>
</footer>

<div id="overlay">
  <div id="panel">
    <div id="panel-title"></div>
    <div id="panel-body"></div>
    <div id="panel-note"></div>
    <button id="btn-rebuy">重新买入 1000</button>
    <button id="btn-next">下一局</button>
  </div>
</div>

<div id="straddle-overlay">
  <div id="straddle-panel">
    <h2>抓位设置</h2>
    <div id="straddle-state"></div>
    <div class="str-btns">
      <button id="btn-str-on">开启（40）</button>
      <button id="btn-str-off">关闭</button>
    </div>
    <div id="straddle-tip">抓位 = 大盲 × 2（40）· 仅房主可设置 · 下一局生效 · 3 人及以上才会抓</div>
    <button id="btn-straddle-close">关闭</button>
  </div>
</div>

<div id="buyins-overlay">
  <div id="buyins-panel">
    <h2>买入记录</h2>
    <div id="buyins-summary"></div>
    <div id="buyins-list"></div>
    <button id="btn-buyins-close">关闭</button>
  </div>
</div>

<div id="lobby">
  <div id="lobby-panel">
    <h1>♠ 在线德州扑克</h1>
    <div id="login-entry" style="display:none">
      <input id="login-user" maxlength="20" placeholder="用户名" autocomplete="username">
      <input id="login-pass" type="password" maxlength="40" placeholder="口令" autocomplete="current-password">
      <button id="btn-login">进入牌室</button>
      <div id="login-msg"></div>
    </div>
    <div id="lobby-entry" style="display:none">
      <input id="name-input" maxlength="8" placeholder="你的昵称（最多8字）">
      <button id="btn-create">创建房间</button>
      <div id="room-list-wrap">
        <div class="rl-title">已存在的房间（点击直接进入）</div>
        <div id="room-list"></div>
      </div>
      <div class="lobby-join">
        <input id="code-input" maxlength="4" placeholder="房间码">
        <button id="btn-join">加入房间</button>
      </div>
      <div id="lobby-msg"></div>
    </div>
    <div id="lobby-conn">连接中…</div>
  </div>
</div>

<script src="/client.js"></script>
</body>
</html>
